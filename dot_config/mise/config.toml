[tasks.develop]
description = "Enter a devShell from the ghq-managed my-nix-package-control"
dir = "{{cwd}}"
raw = true
run = '''
#!/usr/bin/env bash
set -e
if [ "$#" -lt 1 ] || [ -z "$1" ]; then
  printf 'usage: mise develop <environment> [nix develop options...]\n' >&2
  exit 2
fi
environment="$1"
shift
exec nix develop "$HOME/ghq/github.com/himihiromu/my-nix-package-control#$environment" "$@"
'''

[tasks.home-manager]
run = '''
#!/usr/bin/env bash
set -e
if [ "$#" -lt 1 ]; then
  printf 'usage: mise home-manager <action> [options...]\n' >&2
  exit 2
fi
action="$1"
shift
nix run nixpkgs#home-manager -- "$action" --flake "$HOME/ghq/github.com/himihiromu/my-nix-package-control#myHomeConfig" --show-trace --override-input local-options "path:$HOME/.config/nix/local-input/default.nix" "$@"
'''

[tasks.nis-darwin]
run = '''
#!/usr/bin/env bash
set -e
if [ "$#" -lt 1 ]; then
  printf 'usage: mise nis-darwin <action> [options...]\n' >&2
  exit 2
fi
action="$1"
shift
sudo nix run nix-darwin -- "$action" --flake "$HOME/ghq/github.com/himihiromu/my-nix-package-control#mac-config" --override-input local-options "path:$HOME/.config/nix/local-input/default.nix" "$@"
'''

[tasks.nixos]
run = '''
#!/usr/bin/env bash
set -e
if [ "$#" -lt 1 ]; then
  printf 'usage: mise nixos <action> [host] [nixos-rebuild options...]\n' >&2
  exit 2
fi
action="$1"
shift
host_suffix=""
if [ "$#" -gt 0 ] && [[ "$1" != -* ]]; then
  host_suffix="#$1"
  shift
fi
sudo nixos-rebuild "$action" --flake "$HOME/ghq/github.com/himihiromu/my-nix-package-control$host_suffix" --override-input local-options "path:$HOME/.config/nix/local-input/default.nix" "$@"
'''

[tasks.nix]
run = '''
#!/usr/bin/env bash
set -e
if [ "$#" -lt 1 ]; then
  printf 'usage: mise nix <update|gc|nix arguments...> [options...]\n' >&2
  exit 2
fi
case "$1" in
  update)
    shift
    nix flake update "$HOME/ghq/github.com/himihiromu/my-nix-package-control" "$@"
    ;;
  gc)
    shift
    nix-store --gc "$@"
    ;;
  *)
    nix "$@"
    ;;
esac
'''
